<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
	<head>
		<title>Passing Parameters Demo</title>
		<link rel="stylesheet" href="../Common/css/stylesheet2.css"></link>
		<script language="javascript" src="../Common/scripts/jquery-1.8.2.min.js"></script>
		<script language="javascript" src="../Common/scripts/MSXML.js"></script>
		<script language="javascript" src="../Common/scripts/DataSource.js"></script>
		<script language="javascript" src="../Common/scripts/QueryString.js"></script>
		<script language="javascript" src="../Common/scripts/DataSet.js"></script>
		<script language="javascript" src="../Common/scripts/Parameters.js"></script>
		<script language="javascript" src="scripts/PassingParamsDemo.js"></script>
	</head>
	<body onload="documentLoaded();">
		<form id="Form1">
			<div>
				<fieldset>
					<legend>Query Strings</legend>
					<table cellspacing='2' cellpadding='2' border='0'>
						<tr>
							<td class="label">Planet:</td>
							<td><span id="fldPlanet"></span></td>
						</tr>
						<tr>
							<td class="label">Country:</td>
							<td><span id="fldCountry"></span></td>
						</tr>
					</table>
				</fieldset>
			</div>
			<div>
				<fieldset>
					<legend>GUI Parameters</legend>
					<table cellspacing='2' cellpadding='2' border='0'>
						<tr>
							<td class="label">City:</td>
							<td><span id="fldCity"></span></td>
						</tr>
						<tr>
							<td class="label">Suburb:</td>
							<td><span id="fldSuburb"></span></td>
						</tr>
					</table>
				</fieldset>
			</div>
			<div>
				<fieldset>
					<legend>Macro Arguments</legend>
					<table cellspacing='2' cellpadding='2' border='0'>
						<tr>
							<td class="label">Street name:</td>
							<td><span id="fldStreetName"></span></td>
						</tr>
						<tr>
							<td class="label">Street number:</td>
							<td><span id="fldStreetNumber"></span></td>
						</tr>
					</table>
				</fieldset>
			</div>				
		</form>
	</body>
</html>
